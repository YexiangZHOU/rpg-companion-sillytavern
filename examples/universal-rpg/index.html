<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>RPG 通用框架 · 交互原型</title>
<style>/* PANEL_STYLE */</style>
<style>
*{box-sizing:border-box}body{margin:0;background:#111820;color:#e4edf2;font:14px/1.6 'Microsoft YaHei',system-ui,sans-serif}button,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}.demo-top{display:flex;align-items:center;gap:18px;padding:12px 24px;background:#202c37;border-bottom:1px solid #34444e;flex-wrap:wrap}.brand{font-size:17px;font-weight:600;letter-spacing:.4px}.badge{color:#b3d6c7;font-size:12px}.demo-switch{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:12px;color:#a8bac4}.demo-switch select{background:#16222c;border:1px solid #466052;color:#e4edf2;padding:6px 10px;border-radius:6px}.demo-grid{height:calc(100dvh - 63px);min-height:640px;display:grid;grid-template-columns:minmax(280px,1fr) minmax(360px,720px) minmax(280px,1fr)}.demo-scene,.demo-player{position:relative;background:#1a232d;min-width:0}.demo-scene{border-right:1px solid #354450;padding:16px 18px;overflow:auto}.demo-player{border-left:1px solid #354450;display:flex;flex-direction:column}.demo-panel-title{display:flex;justify-content:space-between;align-items:center;margin:0;padding:12px 16px;font-size:15px;border-bottom:1px solid #2d3d48}.demo-panel-title .badge{font-size:11px}#player-panel{flex:1;min-height:0}.demo-more{padding:10px 16px;border-top:1px solid #354450;font-size:12px;color:#aec0ca}.demo-more summary{cursor:pointer}.demo-more button{margin:9px 5px 0 0}.demo-handle{position:absolute;top:45%;width:23px;height:58px;border:0;border-radius:5px;background:#355046;color:#d0e9df;font-size:23px;z-index:5}.demo-scene .demo-handle{right:0}.demo-player .demo-handle{left:0}.demo-scene.is-collapsed>.scene-inner,.demo-player.is-collapsed>#player-panel,.demo-player.is-collapsed>.demo-panel-title,.demo-player.is-collapsed>.demo-more{visibility:hidden}.demo-scene.is-collapsed,.demo-player.is-collapsed{background:transparent;border-color:transparent}.scene-art{height:164px;border-radius:10px;background:radial-gradient(circle at 77% 27%,#c2b38b 0 20px,transparent 21px),linear-gradient(148deg,#486959,#263d43 55%,#172933);position:relative;overflow:hidden;margin:14px 0}.scene-art::before,.scene-art::after{content:'';position:absolute;left:5%;bottom:-15%;width:60%;height:65%;background:#284a3c;transform:rotate(-18deg);border-radius:50%}.scene-art::after{left:48%;background:#3a5b49;transform:rotate(16deg)}.scene-title{margin:0;font-size:18px}.scene-note{font-size:12px;color:#9db0bc}.scene-card{margin:12px 0;padding:12px;background:#23323c;border-radius:8px}.scene-card h3{font-size:13px;margin:0 0 8px;color:#b3c9c6}.scene-card p{font-size:13px;margin:4px 0;color:#cbd8df}.scene-card dl{font-size:12px;display:grid;grid-template-columns:1fr auto;gap:5px}.scene-card dd{margin:0;color:#a5d2bb}.demo-center{padding:22px 26px;display:flex;flex-direction:column;min-width:0;overflow:auto;gap:14px}.demo-center h1{font-size:22px;margin:0}.demo-center .lead{margin:0;color:#a6b7c2;font-size:13px}.demo-history{display:flex;gap:8px;align-items:center;color:#9dafba;font-size:12px}.demo-history select{flex:1;min-width:0;background:#202d37;border:1px solid #3c515c;color:#d5e4eb;border-radius:5px;padding:6px}.demo-message{background:#22303a;border:1px solid #344550;border-radius:10px;padding:18px;line-height:1.9;font-size:15px;overflow-wrap:anywhere}.demo-message small{display:block;color:#9ccbb7;margin-bottom:8px;font-size:12px}.demo-controls{display:flex;flex-wrap:wrap;gap:8px}.demo-feedback{border-left:3px solid #8fc7ad;padding:10px 12px;background:#253830;border-radius:0 6px 6px 0;font-size:13px}.demo-feedback.is-error{border-color:#d89982;background:#402f2c;color:#f4cab6}.demo-changes{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 0}.demo-changes span{background:#1b2b23;padding:3px 8px;border-radius:4px;font-size:12px}.demo-console{font-size:12px;color:#a9bac4;background:#19242e;border:1px solid #354853;border-radius:7px;padding:10px 12px;margin-top:auto}.demo-console>summary{cursor:pointer}.demo-console p{font-size:12px;margin:9px 0}.demo-console textarea{display:block;width:100%;height:210px;resize:vertical;background:#101922;border:1px solid #405a62;border-radius:6px;color:#c8d9df;padding:10px;font:12px/1.5 Consolas,monospace;margin:8px 0}.demo-caption{color:#8fa3b2;font-size:12px}.demo-data-code{max-height:180px;overflow:auto;background:#12202a;padding:12px;white-space:pre-wrap;word-break:break-all;color:#afc8c4}button:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid #acdcbf;outline-offset:2px}
@media(max-width:980px){.demo-grid{grid-template-columns:minmax(330px,1fr) 360px}.demo-scene{display:none}.demo-top{padding:10px 16px}.demo-center{padding:18px}.demo-switch{margin-left:0}}@media(max-width:720px){.demo-grid{display:block;height:calc(100dvh - 111px);min-height:500px}.demo-center{display:none}.demo-player{height:100%;border:0}.demo-top{gap:5px 12px}.demo-switch{width:100%;justify-content:space-between}.demo-player .demo-handle{display:none}.brand{font-size:16px}.demo-top>.badge{font-size:11px}.demo-more{flex:none}}
</style>
</head>
<body>
<header class="demo-top"><div class="brand">RPG Companion / 通用框架</div><span class="badge">本地交互原型 · 合成数据</span><label class="demo-switch">切换合成模型输出 <select id="sample-picker" aria-label="切换合成模型输出"></select></label></header>
<main class="demo-grid">
<aside class="demo-scene"><button id="left-drawer" class="demo-handle" aria-label="收起场景抽屉">‹</button><div class="scene-inner"><h2 class="scene-title">当前场景</h2><div class="scene-art" aria-hidden="true"></div><p id="scene-title" class="scene-note"></p><div class="scene-card"><h3>已建立的数据</h3><dl id="schema-summary"></dl></div><div class="scene-card"><h3>这次原型要验证什么</h3><p>模型创建分类和字段；界面跟随当前定义。</p><p>后续变化按编号保存，旧值与其他对象保持独立。</p></div><p class="demo-caption">这里的图形是示意背景。未连接模型、绘图或线上聊天。</p></div></aside>
<section class="demo-center"><h1 id="game-title"></h1><p id="game-note" class="lead"></p><label class="demo-history">历史分支 <select id="history-picker" aria-label="历史分支"></select></label><article id="narration" class="demo-message"></article><div class="demo-controls"><button id="model-update" class="uf-button uf-primary"></button><button id="model-expand" class="uf-button"></button><button id="repeat-update" class="uf-button">重复提交上次更新</button></div><div id="feedback" class="demo-feedback" role="status" aria-live="polite"></div><div id="changes" class="demo-changes"></div><details class="demo-console"><summary>验证模型输出与初始化协议</summary><p>可粘贴模型生成的 &lt;rpg-framework&gt; 事务；成功后才会更新右侧面板。所有操作仅保存于这个预览。</p><textarea id="model-output" maxlength="200000" aria-label="模型框架输出" spellcheck="false"></textarea><button id="apply-output" class="uf-button">应用输出</button><button id="show-instructions" class="uf-button">查看模型指令</button><button id="empty-session" class="uf-button">测试从空结构初始化</button><pre id="instructions" class="demo-data-code" hidden></pre></details><p class="demo-caption">切换按钮用于审阅不同合成样例，正式游戏无需选择这些模板。</p></section>
<aside class="demo-player"><button id="right-drawer" class="demo-handle" aria-label="收起角色抽屉">›</button><h2 class="demo-panel-title">当前对象 <span class="badge" id="state-version"></span></h2><div id="player-panel"></div><details class="demo-more"><summary>更多</summary><button id="export-state" class="uf-button">导出本地数据</button><span class="demo-caption">骰子、遭遇与绘图将在下一阶段接入。</span></details></aside>
</main>
<script type="module">/* PREVIEW_MODULE */</script>
</body>
</html>
